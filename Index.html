<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VConnecTech — Operating View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F3; --surface:#FFF; --ink:#15181C; --muted:#6E747D;
  --rule:#E4E4DE; --rule2:#CBCBC3; --sel:#2F3A63; --selsoft:#ECEFF7;
  --billed:#1C7A57; --bbilled:#6C9440; --buffer:#C08618; --unbilled:#B04A3E; --none:#9AA0A8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);padding:13px 24px 0}
.hd{max-width:1280px;margin:0 auto}
@media(max-width:600px){header.top{padding:12px 15px 0}}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.brand h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.rail::-webkit-scrollbar{display:none}
nav.rail button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  padding:8px 10px 9px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.rail button:hover{color:var(--ink)}
nav.rail button[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--sel)}
nav.rail button:focus-visible{outline:2px solid var(--sel);outline-offset:-2px;border-radius:3px}
main{padding:22px 24px 80px;max-width:1280px;margin:0 auto}
@media(max-width:600px){main{padding:18px 15px 72px}}

h2.view{font-size:27px;font-weight:600;margin:0 0 3px;letter-spacing:-.018em}
h3{font-size:16px;font-weight:600;margin:34px 0 4px;letter-spacing:-.005em}
p.lede{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:70ch}
p.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}

/* headline stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:17px 18px}
.stat .v{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:2px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.two{display:grid;gap:14px}@media(min-width:900px){.two{grid-template-columns:1fr 1.35fr;align-items:start}}

/* donut */
.donut{display:flex;align-items:center;gap:22px;background:var(--surface);
  border:1px solid var(--rule);border-radius:9px;padding:20px;height:100%}
.donut svg{flex:0 0 148px}
.key{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.key div{display:flex;align-items:center;gap:7px}
.key i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.key b{font-weight:500;margin-left:auto;padding-left:10px}

/* horizontal bars */
.hbars{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:18px;height:100%}
.hrow{margin-bottom:14px}
.hrow:last-child{margin-bottom:0}
.hlab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:10px}
.hlab span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}
.htrack{height:11px;border-radius:99px;background:#EDEDE8;overflow:hidden;display:flex}
.htrack i{display:block;height:100%}
.hrow.click{cursor:pointer}
.hrow.click:hover .hlab span:first-child{color:var(--sel)}

/* pyramid */
.pyr{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:18px}
.pyrow{display:flex;align-items:center;gap:11px;margin-bottom:7px;font-size:14px}
.pyrow:last-child{margin-bottom:0}
.pyrow .lv{width:22px;font-weight:500}
.pyrow .b{height:19px;border-radius:2px;background:var(--sel);opacity:.82;min-width:2px}
.pyrow .n{color:var(--muted);font-size:12px}
.pyrow .yr{color:var(--rule2);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* alerts */
.alert{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--buffer);
  border-radius:5px;padding:11px 13px;margin-bottom:7px}
.alert.hot{border-left-color:var(--unbilled)}
.alert.calm{border-left-color:var(--none)}
.alert b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.alert p{margin:0;font-size:12.5px;color:var(--muted)}

/* cards */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:16px 17px;
  margin-bottom:7px;width:100%;text-align:left;font:inherit;color:inherit;display:block;cursor:pointer}
.card:hover{border-color:var(--rule2)}
.card:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cname{font-weight:600;font-size:16px;letter-spacing:-.01em}
.ccount{font-size:24px;font-weight:500}
.csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#EDEDE8;margin-top:9px}
.bar i{display:block;height:100%}
@media(min-width:620px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .card{margin-bottom:0}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.alerts{display:grid;gap:8px}@media(min-width:900px){.alerts{grid-template-columns:1fr 1fr}}

/* matrix */
.mwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:7px;background:var(--surface)}
table.mx{border-collapse:collapse;font-size:13.5px;min-width:100%}
table.mx th,table.mx td{padding:9px 13px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--rule)}
table.mx thead th{font-weight:500;color:var(--muted);font-size:11.5px;position:sticky;top:0;background:var(--surface)}
table.mx th.rh{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:500;
  border-right:1px solid var(--rule);z-index:1}
table.mx tbody tr:last-child td,table.mx tbody tr:last-child th{border-bottom:0}
table.mx td.z{color:#DCDCD5}
table.mx tfoot td,table.mx tfoot th{font-weight:600;border-top:1px solid var(--rule2);border-bottom:0}

table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:0 8px 6px 0;border-bottom:1px solid var(--rule)}
table.list td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule)}
table.list .r{text-align:right;padding-right:0}

.back{background:none;border:0;padding:0 0 12px;font:inherit;font-size:13px;color:var(--sel);cursor:pointer}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;padding-top:12px;border-top:1px solid var(--rule)}
.empty{border:1px dashed var(--rule2);border-radius:7px;padding:16px;background:var(--surface);color:var(--muted);font-size:13.5px}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:99px;padding:1px 8px;background:var(--bg)}
.load{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:16px;margin-top:26px}
.load textarea{width:100%;height:92px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  border:1px solid var(--rule);border-radius:6px;padding:9px;resize:vertical;background:var(--bg);color:var(--ink)}
.load button{margin-top:9px;background:var(--sel);color:#fff;border:0;border-radius:6px;
  padding:9px 17px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.load button:hover{opacity:.9}
.load .msg{font-size:13px;margin-top:9px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  {id:"pd",       name:"Product Development", owns:"We own the design, plan, price and customer."},
  {id:"innov",    name:"Innovation",          owns:"We own it, but there is no paying customer yet."},
  {id:"ops",      name:"Operations",          owns:"Internal. It exists to support everyone else."}
];
const SECNAME={services:"Services",si:"System Integration",mfg:"Manufacturing",
  pd:"Product Development",innov:"Innovation",ops:"Operations",assign:"Need to Assign"};
const SECID=Object.fromEntries(Object.entries(SECNAME).map(([k,v])=>[v,k]));

const ROLES=["Director","Program Manager","Product Manager","Staff Engineer","Senior Engineer",
             "Engineer","Trainee","Intern","Consultant","Support"];
const BS=[{k:"Billed",c:"var(--billed)",t:"Billed"},
          {k:"Buffer Billed",c:"var(--bbilled)",t:"Buffer billed"},
          {k:"Buffer",c:"var(--buffer)",t:"Buffer"},
          {k:"UnBilled",c:"var(--unbilled)",t:"Unbilled"}];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PMAP=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const aFor=sid=>ALLOCS.filter(a=>SECID[a.sector]===sid);
const fte=as=>as.reduce((s,a)=>s+a.pct,0)/100;
const heads=as=>new Set(as.map(a=>a.emp)).size;
const earning=as=>as.filter(a=>a.billed==="Billed"||a.billed==="Buffer Billed").length;
const splitIds=(()=>{const c={};ALLOCS.forEach(a=>c[a.emp]=(c[a.emp]||0)+1);
  return Object.keys(c).filter(k=>c[k]>1);})();
let state;

function bar(as){const t=as.length||1;
  return `<div class="bar">${BS.map(b=>{const n=as.filter(a=>a.billed===b.k).length;
    return n?`<i style="width:${n/t*100}%;background:${b.c}"></i>`:"";}).join("")}</div>`;}
function key(as){return `<div class="key">${BS.map(b=>{const n=as.filter(a=>a.billed===b.k).length;
    return n?`<div><i style="background:${b.c}"></i>${b.t}<b class="num">${n}</b></div>`:"";}).join("")}</div>`;}

function donut(as){
  const t=as.length,R=52,C=2*Math.PI*R;let off=0;
  const segs=BS.map(b=>{const n=as.filter(a=>a.billed===b.k).length;if(!n)return"";
    const len=n/t*C,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${b.c}" stroke-width="16"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 60 60)"></circle>`;off+=len;return s;}).join("");
  const pct=Math.round(earning(as)/t*100);
  return `<div class="donut"><svg viewBox="0 0 120 120" width="148" height="148" role="img"
    aria-label="${pct} percent of allocations earning">
    ${segs}<text x="60" y="58" text-anchor="middle" class="num" font-size="25" font-weight="500" fill="#15181C">${pct}%</text>
    <text x="60" y="74" text-anchor="middle" font-size="10" fill="#6E747D">earning</text></svg>
    ${key(as)}</div>`;
}

function heat(n,max){
  if(!n) return 'class="z"';
  const o=(0.10+0.62*(n/max)).toFixed(2);
  return `style="background:rgba(47,58,99,${o});color:${n/max>0.45?'#fff':'#15181C'};font-weight:500"`;
}

function roleMatrix(as,title,sub){
  const projs=[...new Set(as.map(a=>a.project))]
    .sort((x,y)=>as.filter(a=>a.project===y).length-as.filter(a=>a.project===x).length);
  const roles=ROLES.filter(r=>as.some(a=>PMAP[a.emp].role===r));
  if(!projs.length||!roles.length) return "";
  let max=1;
  roles.forEach(r=>projs.forEach(p=>{const n=as.filter(a=>a.project===p&&PMAP[a.emp].role===r).length;if(n>max)max=n;}));
  const body=roles.map(r=>`<tr><th class="rh">${esc(r)}</th>${projs.map(p=>{
      const n=as.filter(a=>a.project===p&&PMAP[a.emp].role===r).length;
      return `<td ${heat(n,max)}>${n||"\u00b7"}</td>`;}).join("")}
      <td class="num" style="font-weight:600">${as.filter(a=>PMAP[a.emp].role===r).length}</td></tr>`).join("");
  return `<h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
  <div class="mwrap"><table class="mx">
  <thead><tr><th class="rh">Role</th>${projs.map(p=>`<th>${esc(p)}</th>`).join("")}<th>All</th></tr></thead>
  <tbody>${body}</tbody>
  <tfoot><tr><th class="rh">Total</th>${projs.map(p=>
    `<td class="num">${as.filter(a=>a.project===p).length}</td>`).join("")}
    <td class="num">${as.length}</td></tr></tfoot></table></div>`;
}

/* ================= OVERVIEW ================= */
function renderOverview(){
  const ids=[...SECTORS.map(s=>s.id),"assign"];
  const pct=Math.round(earning(ALLOCS)/ALLOCS.length*100);
  const bench=heads(aFor("assign"));

  const secBars=ids.map(id=>{const as=aFor(id);if(!as.length)return"";
    const t=as.length;
    return `<div class="hrow click" data-view="${id}">
      <div class="hlab"><span>${esc(SECNAME[id])}</span>
        <span>${heads(as)} people \u00b7 ${Math.round(earning(as)/t*100)}% earning</span></div>
      <div class="htrack">${BS.map(b=>{const n=as.filter(a=>a.billed===b.k).length;
        return n?`<i style="width:${n/t*100}%;background:${b.c}"></i>`:"";}).join("")}</div>
    </div>`;}).join("");

  const lv={};PEOPLE.forEach(p=>{const k=p.level||"none";lv[k]=(lv[k]||0)+1;});
  const order=["L5","L4","L3","L2","L1","L0"];
  const mx=Math.max(...order.map(k=>lv[k]||0));
  const pyr=order.map(k=>{const n=lv[k]||0,m=LEVELS.find(l=>l.id===k);
    return `<div class="pyrow"><span class="lv">${k}</span>
      <span class="b" style="width:${Math.max(2,n/mx*58)}%"></span>
      <span class="n num">${n}</span><span class="yr">${esc(m.note)}</span></div>`;}).join("")
    + `<div class="pyrow"><span class="lv" style="color:var(--muted)">\u2014</span>
      <span class="b" style="width:${Math.max(2,(lv.none||0)/mx*58)}%;background:var(--none);opacity:.5"></span>
      <span class="n num">${lv.none||0}</span><span class="yr">no experience recorded</span></div>`;

  const jr=(lv.L0||0)+(lv.L1||0), sr=(lv.L3||0)+(lv.L4||0);
  const emptySec=[...SECTORS.map(s=>s.id)].filter(id=>!aFor(id).length).map(id=>SECNAME[id]);

  return `<h2 class="view">Overview</h2>
  <p class="lede">Where the company stands today, from the roster and the project register.</p>

  <div class="stats">
    <div class="stat"><div class="v num">${PEOPLE.length}</div><div class="l">People</div></div>
    <div class="stat"><div class="v num">${ALLOCS.length}</div><div class="l">Allocations</div></div>
    <div class="stat"><div class="v num" style="color:var(--billed)">${earning(ALLOCS)}</div><div class="l">Earning</div></div>
    <div class="stat"><div class="v num" style="color:var(--unbilled)">${bench}</div><div class="l">Need to assign</div></div>
  </div>

  <div class="two">${donut(ALLOCS)}
    <div class="hbars">${secBars}</div></div>

  <h3>Experience pyramid</h3>
  <p class="sub">Levels derived from years of experience.</p>
  <div class="pyr">${pyr}</div>

  <h3>What needs a decision</h3>
  <div class="alerts"><div class="alert hot"><b>${bench} people are not earning</b>
    <p>Unassigned, on bench or self-learning. At ${Math.round(bench/PEOPLE.length*100)}% of headcount this is the single largest cost lever you have.</p></div>
  <div class="alert"><b>The pyramid is bottom heavy</b>
    <p>${jr} people at L0\u2013L1 against ${sr} at L3\u2013L4. Not enough mid-level people to supervise the juniors.</p></div>
  <div class="alert"><b>${emptySec.length} sectors have nobody in them</b>
    <p>${emptySec.join(" and ")}. ${DATA.letgo} people marked Let Go are excluded from every number here.</p></div>
  <div class="alert calm"><b>${splitIds.length} people are split across two projects</b>
    <p>Which is why allocations (${ALLOCS.length}) exceed headcount (${PEOPLE.length}). Listed under Need to Assign.</p></div></div>

  ${roleMatrix(ALLOCS.map(a=>({...a,project:a.sector})),"Roles across sectors",
    "Company-wide shape. Darker means more people.")}

  <div class="load">
    <h3 style="margin:0 0 3px">Load data from the workbook</h3>
    <p class="sub">Open <b>VCT_Operating_Model.xlsx</b>, go to the <b>Export to Dashboard</b> tab, copy column A from row 5 down, and paste it here. The whole dashboard rebuilds. Nothing is uploaded anywhere.</p>
    <textarea id="paste" placeholder="VC_099|Srikanth Neelam|...|Billed|Service|FLC"></textarea>
    <button id="loadbtn">Rebuild dashboard</button>
    <span class="msg" id="loadmsg"></span>
  </div>

  <p class="note">Buffer billed means the person is working and paid for, but invoiced under another name through a staffing arrangement. It becomes billed once contracted directly.</p>`;
}

/* ================= SECTOR ================= */
function renderSector(id){
  const as=aFor(id),s=SECTORS.find(x=>x.id===id);
  if(!as.length) return `<button class="back" data-view="overview">\u2190 Overview</button>
    <h2 class="view">${esc(SECNAME[id])}</h2><p class="lede">${s?esc(s.owns):""}</p>
    <div class="empty"><b>Nobody assigned here yet</b>${id==="mfg"
      ?"RCI ITS sits on the project register with 5 slots, but no one in the roster is tagged to it."
      :"No projects and no people mapped to this sector."}</div>`;
  const byP={};as.forEach(a=>(byP[a.project]=byP[a.project]||[]).push(a));
  const cards=Object.entries(byP).sort((a,b)=>b[1].length-a[1].length).map(([pn,pa])=>
    `<button class="card" data-project="${encodeURIComponent(id+"|"+pn)}">
      <div class="ctop"><span class="cname">${esc(pn)}</span><span class="ccount num">${pa.length}</span></div>
      <div class="csub">${fte(pa).toFixed(1)} FTE \u00b7 ${Math.round(earning(pa)/pa.length*100)}% earning</div>
      ${bar(pa)}</button>`).join("");
  return `<button class="back" data-view="overview">\u2190 Overview</button>
  <h2 class="view">${esc(SECNAME[id])}</h2>
  <p class="lede">${s?esc(s.owns):"People with no paying work."}</p>
  <div class="stats">
    <div class="stat"><div class="v num">${heads(as)}</div><div class="l">People</div></div>
    <div class="stat"><div class="v num">${fte(as).toFixed(1)}</div><div class="l">FTE</div></div>
    <div class="stat"><div class="v num">${Object.keys(byP).length}</div><div class="l">Projects</div></div>
    <div class="stat"><div class="v num" style="color:var(--billed)">${Math.round(earning(as)/as.length*100)}%</div><div class="l">Earning</div></div>
  </div>
  ${roleMatrix(as,"Roles \u00d7 projects","Who is on what, by role.")}
  <h3>Projects</h3><p class="sub">Tap for the team.</p>${cards}`;
}

/* ================= PROJECT ================= */
function renderProject(k){
  const [sid,pn]=decodeURIComponent(k).split("|");
  const as=aFor(sid).filter(a=>a.project===pn);
  const byRole=ROLES.filter(r=>as.some(a=>PMAP[a.emp].role===r));
  const blocks=byRole.map(r=>{
    const rows=as.filter(a=>PMAP[a.emp].role===r).map(a=>{const p=PMAP[a.emp],b=BS.find(x=>x.k===a.billed);
      return `<tr><td>${esc(p.name)}<div style="color:var(--muted);font-size:12px">${esc(p.designation)} \u00b7 ${esc(p.domain)}</div></td>
        <td class="r">${p.level||"\u2014"}</td>
        <td class="r"><span style="color:${b.c}">${esc(b.t)}</span></td></tr>`;}).join("");
    return `<h3>${esc(r)} <span style="color:var(--muted);font-weight:400">\u00b7 ${as.filter(a=>PMAP[a.emp].role===r).length}</span></h3>
      <table class="list">${rows}</table>`;}).join("");
  return `<button class="back" data-view="${sid}">\u2190 ${esc(SECNAME[sid])}</button>
  <h2 class="view">${esc(pn)}</h2>
  <p class="lede">${esc(SECNAME[sid])}</p>
  <div class="stats">
    <div class="stat"><div class="v num">${as.length}</div><div class="l">On the team</div></div>
    <div class="stat"><div class="v num">${fte(as).toFixed(1)}</div><div class="l">FTE</div></div>
    <div class="stat"><div class="v num">${byRole.length}</div><div class="l">Roles</div></div>
    <div class="stat"><div class="v num" style="color:var(--billed)">${Math.round(earning(as)/as.length*100)}%</div><div class="l">Earning</div></div>
  </div>
  ${donut(as)}
  ${blocks}
  <table class="list" style="margin-top:22px">
    <tr><th>Project head</th><td class="r" style="color:var(--muted)">Person 1 (placeholder)</td></tr>
    <tr><th>Start</th><td class="r" style="color:var(--muted)">01 Apr 2026 (temp)</td></tr>
    <tr><th>End</th><td class="r" style="color:var(--muted)">31 Mar 2027 (temp)</td></tr></table>
  <p class="note">Head and dates are placeholders. The roll-off alert stays off until real end dates are in.</p>`;
}

/* ================= NEED TO ASSIGN ================= */
function renderAssign(){
  const as=aFor("assign");
  const byP={};as.forEach(a=>(byP[a.project]=byP[a.project]||[]).push(a));
  const mx=Math.max(...Object.values(byP).map(v=>v.length));
  const bars=Object.entries(byP).sort((a,b)=>b[1].length-a[1].length).map(([pn,pa])=>
    `<div class="hrow click" data-project="${encodeURIComponent("assign|"+pn)}">
      <div class="hlab"><span>${esc(pn)}</span><span>${pa.length}</span></div>
      <div class="htrack"><i style="width:${pa.length/mx*100}%;background:var(--unbilled)"></i></div>
    </div>`).join("");
  const split=splitIds.map(id=>{const p=PMAP[id],m=ALLOCS.filter(a=>a.emp===id);
    return `<tr><td>${esc(p.name)}<div style="color:var(--muted);font-size:12px">${esc(p.role)} \u00b7 ${p.level||"\u2014"}</div></td>
      <td class="r" style="font-size:12.5px">${m.map(x=>esc(x.project)+" "+x.pct+"%").join("<br>")}</td></tr>`;}).join("");
  return `<h2 class="view">Need to Assign</h2>
  <p class="lede">People with no paying work \u2014 unassigned, on bench, or on self-learning. Self-learning counts as unbilled.</p>
  <div class="stats">
    <div class="stat"><div class="v num" style="color:var(--unbilled)">${heads(as)}</div><div class="l">People</div></div>
    <div class="stat"><div class="v num">${Math.round(heads(as)/PEOPLE.length*100)}%</div><div class="l">Of headcount</div></div>
    <div class="stat"><div class="v num">${Object.keys(byP).length}</div><div class="l">Buckets</div></div>
    <div class="stat"><div class="v num">${splitIds.length}</div><div class="l">Split people</div></div>
  </div>
  <h3>Where they are parked</h3><p class="sub">Tap for names.</p>
  <div class="hbars">${bars}</div>
  ${roleMatrix(as,"Roles \u00d7 bucket","Which roles are idle, and where.")}
  <h3>Split across two projects</h3>
  <p class="sub">Counted in both sectors.</p>
  <table class="list"><tr><th>Person</th><th class="r">Allocation</th></tr>${split}</table>`;
}

const VIEWS=[{id:"overview",label:"Overview"},...SECTORS.map(s=>({id:s.id,label:s.name})),
  {id:"assign",label:"Need to Assign"}];
state={view:"overview",project:null};
function render(){
  $("#rail").innerHTML=VIEWS.map(v=>
    `<button data-view="${v.id}" aria-current="${state.project===null&&state.view===v.id}">${esc(v.label)}</button>`).join("");
  $("#main").innerHTML = state.project!==null ? renderProject(state.project)
    : state.view==="overview" ? renderOverview()
    : state.view==="assign"   ? renderAssign()
    : renderSector(state.view);
  window.scrollTo(0,0);
}
function levelOf(y){ if(y===""||y===null||isNaN(y))return null;
  y=+y; return y>=10?"L5":y>=7?"L4":y>=5?"L3":y>=3?"L2":y>=1?"L1":"L0"; }
function roleOf(d){ const x=(d||"").toLowerCase();
  for(const [k,v] of [["director","Director"],["program manager","Program Manager"],
    ["product manager","Product Manager"],["intern","Intern"],["trainee","Trainee"],
    ["consultant","Consultant"],["staff engineer","Staff Engineer"],["senior engineer","Senior Engineer"]])
    if(x.includes(k)) return v;
  return x.includes("engineer")?"Engineer":"Support"; }
const SECMAP={"Service":"Services","Need to assign":"Need to Assign"};

function reload(txt){
  const lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s && s.includes("|") && !s.startsWith("emp|"));
  if(!lines.length) return {ok:false,msg:"Nothing recognised. Copy column A of the Export tab."};
  const P={},A=[];
  for(const L of lines){
    const f=L.split("|");
    if(f.length<9) continue;
    const [emp,name,lead,domain,desig,yoe,billed,sector,project]=f;
    if(!emp) continue;
    if(!P[emp]) P[emp]={id:emp,name,lead,domain,designation:desig,
      yoe:yoe===""?null:+yoe,level:levelOf(yoe),role:roleOf(desig)};
    for(const s of sector.split(",").map(x=>x.trim()).filter(Boolean))
      A.push({emp,sector:SECMAP[s]||s,project:project||"Unassigned",billed:billed||"Not set"});
  }
  if(!A.length) return {ok:false,msg:"No usable rows found."};
  const c={};A.forEach(a=>c[a.emp]=(c[a.emp]||0)+1);
  A.forEach(a=>a.pct=Math.round(100/c[a.emp]));
  return {ok:true,people:Object.values(P).sort((x,y)=>x.name.localeCompare(y.name)),allocs:A,
          msg:`Loaded ${Object.keys(P).length} people and ${A.length} allocations.`};
}

document.addEventListener("click",e=>{
  if(e.target.id==="loadbtn"){
    const r=reload(document.getElementById("paste").value);
    const m=document.getElementById("loadmsg");
    if(!r.ok){ m.textContent=r.msg; m.style.color="var(--unbilled)"; return; }
    PEOPLE.length=0; PEOPLE.push(...r.people);
    ALLOCS.length=0; ALLOCS.push(...r.allocs);
    Object.keys(PMAP).forEach(k=>delete PMAP[k]);
    PEOPLE.forEach(p=>PMAP[p.id]=p);
    splitIds.length=0;
    const cc={};ALLOCS.forEach(a=>cc[a.emp]=(cc[a.emp]||0)+1);
    splitIds.push(...Object.keys(cc).filter(k=>cc[k]>1));
    state={view:"overview",project:null}; render();
    const m2=document.getElementById("loadmsg");
    if(m2){ m2.textContent=r.msg; m2.style.color="var(--billed)"; }
    return;
  }
  const b=e.target.closest("[data-project],[data-view]");
  if(!b)return;
  if(b.dataset.project!==undefined) state.project=b.dataset.project;
  else {state.view=b.dataset.view;state.project=null;}
  render();
});
render();
</script>
</body>
</html>
